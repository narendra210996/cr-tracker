<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CR Tracker</title>

<style>
body{font-family:Arial;background:#f4f6fb;padding:20px;}
select,input{padding:6px;margin:4px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ddd;padding:8px;font-size:12px;}
th{background:#eee;}
.badge{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:bold;}

.b-req{background:#ede9fe;color:#5b21b6;}
.b-ven{background:#fef3c7;color:#92400e;}
.b-dev{background:#dbeafe;color:#1e40af;}
.b-qa{background:#fce7f3;color:#9d174d;}
.b-rework{background:#fee2e2;color:#991b1b;}
.b-uat{background:#d1fae5;color:#065f46;}
.b-gl{background:#cffafe;color:#0e7490;}
</style>
</head>

<body>

<h2>CR Tracker</h2>

<!-- Add CR -->
<div>
<input id="nc-id" placeholder="CR ID"/>
<input id="nc-title" placeholder="Title"/>

<select id="nc-stage">
<option>Requirement Gathering</option>
<option>Vendor Data Submission</option>
<option>Development</option>
<option>QA / Testing</option>
<option>Rework (QA Failed)</option>
<option>UAT</option>
<option>Go Live</option>
</select>

<button onclick="addCR()">Add CR</button>
</div>

<!-- Table -->
<table>
<thead>
<tr>
<th>ID</th>
<th>Title</th>
<th>Stage</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- Edit Panel -->
<div id="editBox" style="display:none;margin-top:20px;">
<h3>Edit CR</h3>

<select id="e-stage">
<option>Requirement Gathering</option>
<option>Vendor Data Submission</option>
<option>Development</option>
<option>QA / Testing</option>
<option>Rework (QA Failed)</option>
<option>UAT</option>
<option>Go Live</option>
</select>

<button onclick="saveEdit()">Save</button>
</div>

<script>

// STAGES
const STAGES = [
'Requirement Gathering',
'Vendor Data Submission',
'Development',
'QA / Testing',
'Rework (QA Failed)',
'UAT',
'Go Live'
];

const STAGE_CLS = [
'b-req','b-ven','b-dev','b-qa','b-rework','b-uat','b-gl'
];

let data = JSON.parse(localStorage.getItem("cr_data")||"[]");
let currentIndex = null;

// RENDER TABLE
function render(){
let tbody = document.getElementById("tbody");
tbody.innerHTML="";

data.forEach((cr,i)=>{
let tr=document.createElement("tr");

let stageIndex = STAGES.indexOf(cr.stage);

tr.innerHTML=`
<td>${cr.id}</td>
<td>${cr.title}</td>
<td><span class="badge ${STAGE_CLS[stageIndex]}">${cr.stage}</span></td>
<td><button onclick="editCR(${i})">Edit</button></td>
`;

tbody.appendChild(tr);
});
}

// ADD CR
function addCR(){
let id=document.getElementById("nc-id").value;
let title=document.getElementById("nc-title").value;
let stage=document.getElementById("nc-stage").value;

data.push({id,title,stage});
save();
render();
}

// EDIT
function editCR(i){
currentIndex=i;
document.getElementById("editBox").style.display="block";
document.getElementById("e-stage").value=data[i].stage;
}

// SAVE EDIT
function saveEdit(){
let newStage=document.getElementById("e-stage").value;

// ONLY UPDATE STAGE (NO AUTO NOTE)
data[currentIndex].stage=newStage;

save();
render();
document.getElementById("editBox").style.display="none";
}

// SAVE STORAGE
function save(){
localStorage.setItem("cr_data",JSON.stringify(data));
}

// INIT
render();

</script>

</body>
</html>
